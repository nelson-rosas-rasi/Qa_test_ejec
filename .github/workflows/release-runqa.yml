name: Publicar RunQA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar repositorio de pruebas de la suite
        run: npm ci
        working-directory: electron-app/test-fixtures/sample-repo

      - name: Validar versión de la etiqueta
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con package.json v$packageVersion"
          }

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir y publicar instalador
        run: npm run release -- --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Los QA en Linux corren el AppImage. Va DESPUÉS de Windows a propósito: los dos
  # jobs publican en el mismo release, y si arrancan a la vez los dos intentan
  # crearlo y uno falla. Este sube el AppImage y el `latest-linux.yml` que necesita
  # electron-updater para que la actualización llegue sola, igual que en Windows.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-app
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar repositorio de pruebas de la suite
        run: npm ci
        working-directory: electron-app/test-fixtures/sample-repo

      - name: Validar versión de la etiqueta
        if: github.event_name == 'push'
        run: |
          packageVersion=$(node -p "require('./package.json').version")
          if [ "v$packageVersion" != "${{ github.ref_name }}" ]; then
            echo "La etiqueta ${{ github.ref_name }} no coincide con package.json v$packageVersion" >&2
            exit 1
          fi

      - name: Ejecutar pruebas
        run: npm test

      - name: Construir y publicar AppImage
        run: npm run release -- --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
